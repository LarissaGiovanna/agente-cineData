[project]
name = "cinedata-agent"
version = "0.1.0"
description = "Agente Text-to-SQL sobre a camada Gold do CineData (Rocket Lab 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openrouter]>=2.51",
    "python-dotenv>=1.0",
]

[project.scripts]
cinedata-chat = "cinedata.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cinedata"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"